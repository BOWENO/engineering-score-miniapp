limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name www.testengineering.cloud testengineering.cloud;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://www.testengineering.cloud$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name www.testengineering.cloud;

    ssl_certificate /etc/letsencrypt/live/www.testengineering.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.testengineering.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    location /actuator/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name testengineering.cloud;
    ssl_certificate /etc/letsencrypt/live/www.testengineering.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.testengineering.cloud/privkey.pem;
    return 301 https://www.testengineering.cloud$request_uri;
}
